<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project BEACH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><div><div class="brand">Project BEACH</div><div class="sub">LIVE COAST CONDITIONS</div></div><b>🌊 LIVE</b></header>
<div class="search">🔎 <input id="q" placeholder="Търси плаж..." oninput="searchBeach()"></div>
<div class="notice" id="notice">📍 Натисни GPS за местоположение</div>
<div id="map"></div>
<button class="gps" onclick="locate()">📍</button>
<div id="sheet" class="sheet">
 <div class="row"><div><div class="name" id="bn"></div><div class="status" id="bs"></div></div><b id="score"></b></div>
 <div class="metrics"><div class="metric">🌊 Вълни<b id="waves"></b></div><div class="metric">🌡️ Вода<b id="water"></b></div><div class="metric">🌬️ Вятър<b id="wind"></b></div></div><div class="metric" style="margin-bottom:12px">📍 Разстояние до плажа<b id="distance">—</b></div>
 <div class="actions"><button class="go" onclick="navigate()">🧭 Заведи ме там</button><button class="details" onclick="alert('Тук ще добавим пълния екран за плажа.')">Детайли</button></div>
</div>
<nav><button><span class="ico">🗺️</span>Карта</button><button><span class="ico">🏆</span>Топ</button><button><span class="ico">➕</span>Сигнал</button><button><span class="ico">👤</span>Профил</button></nav>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="beaches.js"></script>
<script src="app.js"></script>
<script src="firebase-realtime.js"></script>
<!-- ЗАМЕНИ YOUR_GOOGLE_MAPS_API_KEY С ТВОЯ GOOGLE MAPS API KEY -->
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAHBUWCvKcomcEHa8wI7WDz4I1ISG-BxtE&callback=initMap"></script>
</body></html>
